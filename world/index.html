<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9ed7eb">
<title>育つ小さな世界 — World Quality Test</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed7eb;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}body{touch-action:none}.scene{position:fixed;inset:0;background:linear-gradient(180deg,#84c8e8 0%,#b7e0ef 48%,#eff8f5 100%)}canvas{display:block;width:100%;height:100%}.veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 0 34%,rgba(25,61,78,.04) 60%,rgba(8,30,43,.18) 100%)}.ui{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}.brand{filter:drop-shadow(0 2px 10px #ffffff66)}.brand small{display:block;color:#315263;font-size:9px;font-weight:800;letter-spacing:.18em}.brand h1{margin:5px 0 0;color:#173646;font-size:20px;letter-spacing:.02em}.chip{align-self:flex-start;margin-top:8px;padding:7px 10px;border-radius:999px;background:#ffffff77;border:1px solid #ffffff99;backdrop-filter:blur(12px);color:#2a4b5d;font-size:10px;font-weight:700;letter-spacing:.08em}.bottom{align-self:center;text-align:center;color:#234758;text-shadow:0 1px 8px #fff}.bottom strong{display:block;font-size:13px}.bottom span{display:block;margin-top:4px;font-size:10px;opacity:.72}.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(#8bcde9,#e8f6f4);transition:.7s}.loading.hide{opacity:0;pointer-events:none}.loader{text-align:center;color:#274a59}.loader i{display:block;width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:2px solid #ffffff99;border-top-color:#315a6b;animation:spin .8s linear infinite}.loader b{font-size:12px;letter-spacing:.12em}@keyframes spin{to{transform:rotate(360deg)}}.error{position:fixed;left:16px;right:16px;bottom:16px;z-index:30;padding:14px;border-radius:16px;background:#291818dd;color:#fff;display:none;font-size:12px;line-height:1.5}.error.show{display:block}@media (min-width:760px){.ui{padding:28px 32px}.brand h1{font-size:24px}.bottom strong{font-size:14px}}
</style>
</head>
<body>
<div class="scene" id="scene"></div>
<div class="veil"></div>
<div class="ui">
  <div class="brand"><small>A SMALL LIVING WORLD · QUALITY TEST</small><h1>育つ小さな世界</h1><div class="chip">WORLD QUALITY 01</div></div>
  <div class="bottom"><strong>指で世界を少し回してみる</strong><span>ドラッグ：視点　／　ピンチ：距離</span></div>
</div>
<div class="loading" id="loading"><div class="loader"><i></i><b>WORLD FORMING</b></div></div>
<div class="error" id="error">3D世界を読み込めませんでした。通信状態を確認して、もう一度開いてください。</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const mount=document.getElementById('scene'),loading=document.getElementById('loading'),errorBox=document.getElementById('error');
try{
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xc9e8ee,0.035);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
camera.position.set(7.2,5.6,9.6);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.setClearColor(0xaadbea,0);
mount.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=8;controls.maxDistance=14;controls.minPolarAngle=.72;controls.maxPolarAngle=1.42;controls.target.set(0,.35,0);controls.rotateSpeed=.48;controls.zoomSpeed=.65;

scene.add(new THREE.HemisphereLight(0xeaf9ff,0x6c735b,2.4));
const sun=new THREE.DirectionalLight(0xfff0c7,4.4);sun.position.set(-5,9,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-8;scene.add(sun);
const fill=new THREE.DirectionalLight(0x8bd5ff,1.3);fill.position.set(6,2,-5);scene.add(fill);

const world=new THREE.Group();world.position.y=.15;scene.add(world);
const cliffMat=new THREE.MeshStandardMaterial({color:0x594d41,roughness:.88,metalness:0,flatShading:true});
const cliffGeo=new THREE.ConeGeometry(3.85,4.8,11,6,false,0,Math.PI*2);cliffGeo.rotateX(Math.PI);const cliff=new THREE.Mesh(cliffGeo,cliffMat);cliff.position.y=-2.15;cliff.scale.set(1,.92,1);cliff.castShadow=true;cliff.receiveShadow=true;world.add(cliff);
const shelfMat=new THREE.MeshStandardMaterial({color:0x77685a,roughness:.95,flatShading:true});for(let i=0;i<18;i++){const g=new THREE.DodecahedronGeometry(.34+Math.random()*.42,0),m=new THREE.Mesh(g,shelfMat);const a=Math.random()*Math.PI*2,r=2.65+Math.random()*.95;m.position.set(Math.cos(a)*r,-.55-Math.random()*1.45,Math.sin(a)*r);m.scale.set(1.15,.7,.8);m.rotation.set(Math.random(),a,Math.random());m.castShadow=true;world.add(m)}
const soilMat=new THREE.MeshStandardMaterial({color:0x8d6d48,roughness:1,flatShading:true});const soil=new THREE.Mesh(new THREE.CylinderGeometry(3.85,3.45,.75,32,2),soilMat);soil.position.y=.02;soil.castShadow=true;soil.receiveShadow=true;world.add(soil);const turfMat=new THREE.MeshStandardMaterial({color:0x6ea653,roughness:.95,flatShading:true});const turf=new THREE.Mesh(new THREE.CylinderGeometry(3.76,3.72,.22,48,1),turfMat);turf.position.y=.48;turf.castShadow=true;turf.receiveShadow=true;world.add(turf);
const patchMat=new THREE.MeshStandardMaterial({color:0x91bd67,roughness:1});for(let i=0;i<22;i++){const g=new THREE.CircleGeometry(.25+Math.random()*.5,9);const p=new THREE.Mesh(g,patchMat);const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*3.15;p.position.set(Math.cos(a)*r,.602,Math.sin(a)*r);p.rotation.x=-Math.PI/2;p.rotation.z=Math.random()*6;p.scale.y=.55+Math.random()*.8;world.add(p)}
const pondGeo=new THREE.CircleGeometry(1.18,64);const pondMat=new THREE.ShaderMaterial({transparent:true,side:THREE.DoubleSide,uniforms:{uTime:{value:0},uDeep:{value:new THREE.Color(0x2f8ba8)},uShallow:{value:new THREE.Color(0x8be1df)}},vertexShader:`varying vec2 vUv;uniform float uTime;void main(){vUv=uv;vec3 p=position;p.z+=sin((p.x+p.y)*8.0+uTime*1.7)*0.018+sin(p.x*14.0-uTime*1.2)*0.012;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uTime;uniform vec3 uDeep;uniform vec3 uShallow;void main(){float d=distance(vUv,vec2(.5));float ring=.5+.5*sin(d*45.0-uTime*2.2);float edge=smoothstep(.5,.18,d);vec3 c=mix(uDeep,uShallow,(1.0-d)*.78+ring*.08);gl_FragColor=vec4(c,.88*edge);}`});const pond=new THREE.Mesh(pondGeo,pondMat);pond.rotation.x=-Math.PI/2;pond.position.set(.45,.645,.35);pond.scale.set(1.35,.82,1);world.add(pond);
const stoneMats=[0x7f8077,0x96958b,0x666b65].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true}));for(let i=0;i<17;i++){const a=Math.random()*Math.PI*2,r=1.25+Math.random()*.45;const s=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.18,0),stoneMats[i%3]);s.position.set(.45+Math.cos(a)*r,.7,.35+Math.sin(a)*r*.72);s.scale.set(1.3,.65,1);s.rotation.y=Math.random()*6;s.castShadow=true;world.add(s)}
const fallMat=new THREE.MeshPhysicalMaterial({color:0x8edcf0,transparent:true,opacity:.72,roughness:.15,transmission:.1,side:THREE.DoubleSide});const fall=new THREE.Mesh(new THREE.PlaneGeometry(.42,2.15,1,8),fallMat);fall.position.set(1.52,-.42,.28);fall.rotation.y=-.05;world.add(fall);const mistGeo=new THREE.BufferGeometry(),mistPos=[];for(let i=0;i<70;i++){mistPos.push(1.3+(Math.random()-.5)*.9,-1.5+Math.random()*.9,.2+(Math.random()-.5)*.8)}mistGeo.setAttribute('position',new THREE.Float32BufferAttribute(mistPos,3));const mist=new THREE.Points(mistGeo,new THREE.PointsMaterial({color:0xe5fbff,size:.06,transparent:true,opacity:.38,depthWrite:false}));world.add(mist);
const bladeGeo=new THREE.ConeGeometry(.035,.42,3,1);bladeGeo.translate(0,.21,0);const bladeMat=new THREE.MeshStandardMaterial({color:0x5a9348,roughness:1,flatShading:true});const grassCount=420;const grass=new THREE.InstancedMesh(bladeGeo,bladeMat,grassCount);grass.castShadow=false;grass.receiveShadow=true;const dummy=new THREE.Object3D();let placed=0;while(placed<grassCount){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*3.5;const x=Math.cos(a)*r,z=Math.sin(a)*r;if((x-.45)**2/1.8+(z-.35)**2/1.0<1.0)continue;dummy.position.set(x,.59,z);const sc=.55+Math.random()*.9;dummy.scale.set(sc,sc,sc);dummy.rotation.y=Math.random()*6;dummy.rotation.z=(Math.random()-.5)*.12;dummy.updateMatrix();grass.setMatrixAt(placed++,dummy.matrix)}world.add(grass);
function makeTree(x,z,s=1){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.09,.14,.9,7),new THREE.MeshStandardMaterial({color:0x6f4a2d,roughness:1}));trunk.position.y=.45;trunk.castShadow=true;g.add(trunk);const crownMat=new THREE.MeshStandardMaterial({color:0x4f8f49,roughness:.95,flatShading:true});[[0,.98,0,.72],[.35,.88,.08,.48],[-.3,.9,-.12,.52]].forEach(v=>{const c=new THREE.Mesh(new THREE.IcosahedronGeometry(v[3],1),crownMat);c.position.set(v[0],v[1],v[2]);c.scale.y=.84;c.castShadow=true;g.add(c)});g.position.set(x,.58,z);g.scale.setScalar(s);world.add(g);return g}const trees=[makeTree(-2.15,-.55,1.05),makeTree(-1.55,-1.65,.82),makeTree(2.18,-1.05,.9),makeTree(2.45,.62,.72),makeTree(-2.45,1.2,.68)];
const flowerColors=[0xffdf77,0xffffff,0xf2a4c9,0xc9b1ff];for(let i=0;i<75;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*3.25,x=Math.cos(a)*r,z=Math.sin(a)*r;if((x-.45)**2/1.7+(z-.35)**2/.9<1)continue;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.012,.016,.18,5),new THREE.MeshStandardMaterial({color:0x3c783d}));stem.position.set(x,.69,z);const bloom=new THREE.Mesh(new THREE.SphereGeometry(.045,6,4),new THREE.MeshStandardMaterial({color:flowerColors[i%flowerColors.length],emissive:flowerColors[i%flowerColors.length],emissiveIntensity:.08}));bloom.position.set(x,.79,z);world.add(stem,bloom)}
const clouds=new THREE.Group();scene.add(clouds);function cloud(x,y,z,s){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.73,roughness:1,depthWrite:false});for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.55+Math.random()*.5,12,8),mat);m.position.set((i-2)*.45,(Math.random()-.5)*.2,(Math.random()-.5)*.18);m.scale.y=.6;g.add(m)}g.position.set(x,y,z);g.scale.setScalar(s);clouds.add(g);return g}const cloudObjs=[cloud(-7,4,-5,1.2),cloud(7,5,-7,1.45),cloud(-8,2.7,2,1),cloud(8,3.4,1,1.1)];
const particleCount=110,positions=new Float32Array(particleCount*3),seeds=new Float32Array(particleCount);for(let i=0;i<particleCount;i++){const a=Math.random()*Math.PI*2,r=1+Math.random()*3.6;positions[i*3]=Math.cos(a)*r;positions[i*3+1]=.8+Math.random()*2.7;positions[i*3+2]=Math.sin(a)*r;seeds[i]=Math.random()*10}const sparkGeo=new THREE.BufferGeometry();sparkGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));const sparkMat=new THREE.PointsMaterial({color:0xfff3aa,size:.055,transparent:true,opacity:.58,depthWrite:false,blending:THREE.AdditiveBlending});const sparks=new THREE.Points(sparkGeo,sparkMat);world.add(sparks);
const birds=new THREE.Group();scene.add(birds);for(let i=0;i<7;i++){const mat=new THREE.LineBasicMaterial({color:0x385c68,transparent:true,opacity:.55});const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.16,0,0),new THREE.Vector3(0,.07,0),new THREE.Vector3(.16,0,0)]);const bird=new THREE.Line(geo,mat);bird.userData={a:i*.9,r:5.8+i*.35,y:2.6+(i%3)*.38,s:.12+i*.02};birds.add(bird)}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();controls.update();pondMat.uniforms.uTime.value=t;world.position.y=.15+Math.sin(t*.65)*.065;world.rotation.y=Math.sin(t*.18)*.025;trees.forEach((tr,i)=>tr.rotation.z=Math.sin(t*.8+i)*.008);cloudObjs.forEach((c,i)=>{c.position.x+=.0015*(i%2?1:-1);if(c.position.x>10)c.position.x=-10;if(c.position.x<-10)c.position.x=10});const pa=sparkGeo.attributes.position.array;for(let i=0;i<particleCount;i++){pa[i*3+1]+=.0018+Math.sin(t+seeds[i])*.0008;if(pa[i*3+1]>3.7)pa[i*3+1]=.8}sparkGeo.attributes.position.needsUpdate=true;birds.children.forEach((b,i)=>{const d=b.userData,a=t*d.s+d.a;b.position.set(Math.cos(a)*d.r,d.y+Math.sin(a*2)*.18,Math.sin(a)*d.r);b.rotation.y=-a});renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75))});setTimeout(()=>loading.classList.add('hide'),450);
}catch(err){console.error(err);loading.classList.add('hide');errorBox.classList.add('show')}
</script>
</body>
</html>
