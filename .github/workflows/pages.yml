name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build nantchatte-box
        working-directory: nantchatte-box
        run: |
          npm install
          npm run build

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/world _site/nantchatte-box _site/practice

          cp world/index.html _site/world/index.html
          cp -a nantchatte-box/dist/. _site/nantchatte-box/
          cp -a practice/. _site/practice/

          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>flow-App</title>
            <style>
              body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:0 auto;padding:48px 20px;color:#202124;background:#fafafa}
              h1{font-size:28px;margin:0 0 8px}.sub{color:#6b7280;margin:0 0 28px}.apps{display:grid;gap:14px}
              a{display:block;padding:20px;border:1px solid #e5e7eb;border-radius:14px;background:white;color:inherit;text-decoration:none}
              a:hover{border-color:#9ca3af}.name{font-weight:800;font-size:18px}.desc{margin-top:6px;color:#6b7280;font-size:14px;line-height:1.6}
            </style>
          </head>
          <body>
            <h1>flow-App</h1>
            <p class="sub">公開用アプリ</p>
            <main class="apps">
              <a href="./world/"><div class="name">育つ小さな世界</div><div class="desc">World Quality Test</div></a>
              <a href="./nantchatte-box/"><div class="name">なんちゃってBOX</div><div class="desc">考えずにポイ。あとから観測する箱。</div></a>
              <a href="./practice/"><div class="name">Sky Isles Practice</div><div class="desc">島を進みながら遊ぶ練習ビルド。</div></a>
            </main>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
