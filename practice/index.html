<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Sky Isles Practice 06</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfe7f2;font-family:system-ui;touch-action:none}canvas{display:block}.tag,.goal,.msg{position:fixed;z-index:6;pointer-events:none;border-radius:999px;backdrop-filter:blur(8px)}.tag{left:14px;top:max(14px,env(safe-area-inset-top));padding:8px 11px;background:#ffffffaa;color:#27475a;font-size:10px;font-weight:900}.goal{left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 13px;background:#fff8ccdf;color:#5d4d76;font-size:11px;font-weight:900;white-space:nowrap;max-width:58vw;overflow:hidden;text-overflow:ellipsis}.msg{left:50%;top:58px;transform:translateX(-50%);padding:7px 12px;background:#ffffffbb;color:#4f5870;font-size:10px;opacity:0;transition:.25s}.msg.show{opacity:1}.joy{position:fixed;left:20px;bottom:max(24px,env(safe-area-inset-bottom));z-index:8;width:112px;height:112px;border-radius:50%;background:#ffffff33;border:1px solid #ffffff88}.knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#ffffffaa}.jump{position:fixed;right:22px;bottom:max(32px,calc(env(safe-area-inset-bottom) + 8px));z-index:8;width:72px;height:72px;border:0;border-radius:50%;background:#fffbd7dd;color:#634d72;font-weight:900}.jump:active{transform:scale(.94)}.ending{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:linear-gradient(#1b1640dd,#6e69a7cc);opacity:0;pointer-events:none;transition:.65s}.ending.show{opacity:1;pointer-events:auto}.card{width:min(88vw,360px);padding:26px 22px;border-radius:28px;background:#ffffffee;color:#443b66;text-align:center;box-shadow:0 24px 70px #19123888}.card small{font-size:9px;letter-spacing:.18em;font-weight:900}.card h1{margin:8px 0 10px;font-size:26px}.card p{margin:0 0 18px;font-size:12px;line-height:1.65;color:#665d7d}.card button{border:0;border-radius:999px;padding:11px 18px;background:#d8c8ff;color:#453568;font-weight:900;font-size:12px}@media(pointer:fine){.joy,.jump{display:none}}@media(max-width:430px){.tag{font-size:9px}.goal{top:52px;max-width:82vw}.msg{top:88px}}</style></head><body><div class="tag">PRACTICE 06 · MOBILE FINISH</div><div class="goal" id="goal">橋を渡り、5つの音を順に鳴らす</div><div class="msg" id="msg"></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="jump" id="jump">JUMP</button><div class="ending" id="ending"><div class="card"><small>SKY ISLES PRACTICE · COMPLETE</small><h1>星のかけらを見つけた</h1><p>見る → 歩く → 渡る → 解く → 世界が開く → 報酬に届く。<br>練習作を一本、最初から最後まで閉じた。</p><button id="again">もう一度</button></div></div><script type="module">import * as THREE from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const mobile=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window,low=mobile&&Math.max(innerWidth,innerHeight)<950,scene=new THREE.Scene();scene.background=new THREE.Color(0xbfe7f2);scene.fog=new THREE.Fog(0xbfe7f2,26,90);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,180),renderer=new THREE.WebGLRenderer({antialias:!low,powerPreference:'high-performance'});let quality=low?1:mobile?1.15:1.65;function applyQuality(){renderer.setPixelRatio(Math.min(devicePixelRatio,quality));renderer.setSize(innerWidth,innerHeight,false)}applyQuality();renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xf4fbff,0x756b8f,2.35));const sun=new THREE.DirectionalLight(0xfff2d2,3.4);sun.position.set(-7,12,8);scene.add(sun);const mat=c=>new THREE.MeshToonMaterial({color:c});function island(x,y,z,r,c=0x8fdcb4){const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);g.add(new THREE.Mesh(new THREE.CylinderGeometry(r,r*.91,1,low?18:24),mat(c)));const rock=new THREE.Mesh(new THREE.CylinderGeometry(r*.92,r*.45,3.2,low?8:11),mat(0xb09bcf));rock.position.y=-2.05;g.add(rock);const tip=new THREE.Mesh(new THREE.ConeGeometry(r*.46,3.2,low?7:9),mat(0x8873b0));tip.position.y=-5.15;g.add(tip);return{g,pos:new THREE.Vector3(x,y,z),r,topY:y+.5}}function tree(parent,x,z,s=1,gl=false){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.13,.2,1.35,6),mat(0x7d5942)),cm=gl?new THREE.MeshToonMaterial({color:0x86d99d,emissive:0x74ffc0,emissiveIntensity:.45}):mat(0x67b78d);tr.position.y=.67;g.add(tr);for(const p of[[0,1.5,0,.82],[-.4,1.35,.05,.52],[.38,1.33,-.1,.56]]){const c=new THREE.Mesh(new THREE.IcosahedronGeometry(p[3],low?0:1),cm);c.position.set(p[0],p[1],p[2]);g.add(c)}g.position.set(x,.52,z);g.scale.setScalar(s);parent.add(g)}const home=island(0,0,0,5);tree(home.g,-2,-1,1.05);tree(home.g,2,1,.8);const shrine=island(15,2.2,-7.5,4.2,0x9ad9ac);tree(shrine.g,0,0,1.55,true);const glow=new THREE.PointLight(0x9fffc7,3,11);glow.position.set(15,5,-7.5);scene.add(glow);function bridge(a,b){const d=new THREE.Vector3().subVectors(b.pos,a.pos),dist=d.length();d.normalize();const s=a.pos.clone().addScaledVector(d,a.r-.45),e=b.pos.clone().addScaledVector(d,-(b.r-.45));s.y=a.topY;e.y=b.topY;const m=s.clone().lerp(e,.5);m.y-=Math.max(.8,dist*.055);const curve=new THREE.QuadraticBezierCurve3(s,m,e),group=new THREE.Group(),pm=mat(0xd9b98f),rm=mat(0x9472ad),tan=new THREE.Vector3(),count=Math.max(10,Math.round(s.distanceTo(e)/.72));scene.add(group);for(let i=0;i<count;i++){const t=(i+.5)/count,p=new THREE.Mesh(new THREE.BoxGeometry(1.45,.1,.58),pm);curve.getPoint(t,p.position);curve.getTangent(t,tan);p.lookAt(p.position.clone().add(tan));group.add(p)}const perp=new THREE.Vector3(-d.z,0,d.x).multiplyScalar(.74);for(const side of[-1,1]){const o=perp.clone().multiplyScalar(side),rs=s.clone().add(o).add(new THREE.Vector3(0,.9,0)),re=e.clone().add(o).add(new THREE.Vector3(0,.9,0)),rmid=m.clone().add(o).add(new THREE.Vector3(0,.5,0));group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(rs,rmid,re),low?12:24,.04,4),rm))}return curve}const path=bridge(home,shrine),order=[2,4,0,3,1],cc=[0xa8e6cf,0xcdb4f0,0xfff3d6,0x9fd8f0,0xf2b8c6],chimes=[];for(let i=0;i<5;i++){const a=-1+i*.5,x=15+Math.cos(a)*2.25,z=-7.5+Math.sin(a)*2.25,g=new THREE.Group(),pole=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,1.35,5),mat(0x80638f)),bell=new THREE.Mesh(new THREE.ConeGeometry(.22,.45,8,1,true),new THREE.MeshToonMaterial({color:cc[i],emissive:cc[i],emissiveIntensity:.18}));pole.position.y=.68;bell.position.y=1.15;g.add(pole,bell);g.position.set(x,3,z);scene.add(g);chimes.push({g,bell,x,z,index:i,hit:false})}function portalRing(c=0xcdb4f0){const g=new THREE.Group(),ring=new THREE.Mesh(new THREE.TorusGeometry(1,.11,8,low?24:40),new THREE.MeshToonMaterial({color:c,emissive:c,emissiveIntensity:.9})),disc=new THREE.Mesh(new THREE.CircleGeometry(.84,low?24:36),new THREE.MeshBasicMaterial({color:0xfff3d6,transparent:true,opacity:.42,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(ring,disc);return{g,disc}}const portal=portalRing();portal.g.position.set(17.2,4,-5.2);portal.g.visible=false;scene.add(portal.g);const BY=45,bonus=island(0,BY,0,4,0x7ecfae);bonus.g.visible=false;const night=new THREE.Mesh(new THREE.SphereGeometry(42,low?14:20,low?10:14),new THREE.MeshBasicMaterial({color:0x1a1440,side:THREE.BackSide,fog:false}));night.position.y=BY;night.visible=false;scene.add(night);const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<(low?260:520);i++){const th=Math.random()*Math.PI*2,ph=.1+Math.random()*Math.PI*.8,r=28+Math.random()*9;sp.push(Math.cos(th)*Math.sin(ph)*r,BY+Math.cos(ph)*r,Math.sin(th)*Math.sin(ph)*r)}sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.22,transparent:true,opacity:.9,depthWrite:false}));stars.visible=false;scene.add(stars);const reward=new THREE.Mesh(new THREE.OctahedronGeometry(.62,0),new THREE.MeshToonMaterial({color:0xf2b8c6,emissive:0xf2b8c6,emissiveIntensity:1}));reward.position.set(0,BY+2.1,0);reward.scale.set(1,1.25,.7);reward.visible=false;scene.add(reward);const rewardLight=new THREE.PointLight(0xf2b8c6,low?10:20,18,1.7);rewardLight.visible=false;scene.add(rewardLight);const back=portalRing(0xa8e6cf);back.g.position.set(-2.4,BY+1.9,-1.6);back.g.visible=false;scene.add(back.g);function hero(){const g=new THREE.Group(),bm=mat(0xfff3d6),body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.42,4,8),bm),head=new THREE.Mesh(new THREE.SphereGeometry(.26,low?10:14,low?8:10),bm),cape=new THREE.Mesh(new THREE.PlaneGeometry(.55,.5),new THREE.MeshToonMaterial({color:0xcdb4f0,side:THREE.DoubleSide}));body.position.y=.68;head.position.y=1.18;cape.position.set(0,.92,-.21);cape.rotation.x=1;g.add(body,head,cape);scene.add(g);return{g,body,cape}}const h=hero(),pos=new THREE.Vector3(0,.51,2.2),vel=new THREE.Vector3(),keys={};let grounded=true,jumps=0,yaw=Math.PI,pitch=.42,heading=Math.PI,jq=false,progress=0,portalOpen=false,inBonus=false,finished=false,lastSafe=pos.clone(),cool=0;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')jq=true});addEventListener('keyup',e=>keys[e.code]=false);jump.onpointerdown=e=>{e.preventDefault();jq=true};const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null,jx=0,jy=0;function sj(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,L=Math.hypot(dx,dy),M=38,k=Math.min(1,M/(L||1)),x=dx*k,y=dy*k;jx=x/M;jy=y/M;knob.style.transform=`translate(${x}px,${y}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);sj(e)};joy.onpointermove=e=>{if(e.pointerId===jid)sj(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform='translate(0,0)'}};let cid=null,lx=0,ly=0;renderer.domElement.onpointerdown=e=>{if(e.clientX<innerWidth*.38)return;cid=e.pointerId;lx=e.clientX;ly=e.clientY};renderer.domElement.onpointermove=e=>{if(e.pointerId!==cid)return;yaw-=(e.clientX-lx)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-ly)*.004,.15,.85);lx=e.clientX;ly=e.clientY};renderer.domElement.onpointerup=e=>{if(e.pointerId===cid)cid=null};function ground(x,z){if(inBonus)return Math.hypot(x,z)<bonus.r*.9?BY+.51:null;for(const I of[home,shrine])if(Math.hypot(x-I.pos.x,z-I.pos.z)<I.r*.9)return I.topY+.01;let best=999,yy=null;for(let i=0;i<=50;i++){const p=path.getPoint(i/50),d=Math.hypot(x-p.x,z-p.z);if(d<best){best=d;yy=p.y}}return best<.9?yy+.08:null}const msg=document.getElementById('msg'),goal=document.getElementById('goal'),ending=document.getElementById('ending');let mt=0;function say(s){msg.textContent=s;msg.classList.add('show');mt=1.6}function hit(c){if(c.hit||portalOpen)return;c.hit=true;setTimeout(()=>c.hit=false,300);if(c.index===order[progress]){progress++;say(`正解 ${progress} / 5`);if(progress===5){portalOpen=true;portal.g.visible=true;goal.textContent='開いたポータルへ入る';say('世界が開いた')}}else{progress=0;say('順番が違う · 最初から')}}function enterBonus(){inBonus=true;cool=1.2;bonus.g.visible=night.visible=stars.visible=reward.visible=rewardLight.visible=back.g.visible=true;home.g.visible=shrine.g.visible=false;portal.g.visible=false;pos.set(1.5,BY+.51,1.5);vel.set(0,0,0);lastSafe.copy(pos);scene.background=new THREE.Color(0x1a1440);scene.fog=null;goal.textContent='星のかけらへ近づく';say('星の島へ')}function complete(){if(finished)return;finished=true;goal.textContent='COMPLETE';ending.classList.add('show')}again.onclick=()=>location.reload();window.__practice={getState:()=>({progress,portalOpen,inBonus,finished,quality,low,pos:{x:pos.x,y:pos.y,z:pos.z}}),completePuzzle(){progress=5;portalOpen=true;portal.g.visible=true},enterBonus,complete};const clock=new THREE.Clock(),target=new THREE.Vector3(),cam=new THREE.Vector3();let raf=0,frames=0,perfStart=performance.now(),paused=false;document.addEventListener('visibilitychange',()=>{paused=document.hidden;if(!paused)clock.getDelta()});function frame(){raf=requestAnimationFrame(frame);if(paused)return;const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;cool=Math.max(0,cool-dt);let ix=jx,iz=-jy;if(keys.KeyA||keys.ArrowLeft)ix--;if(keys.KeyD||keys.ArrowRight)ix++;if(keys.KeyW||keys.ArrowUp)iz++;if(keys.KeyS||keys.ArrowDown)iz--;const L=Math.hypot(ix,iz);if(L>1){ix/=L;iz/=L}if(finished)ix=iz=0;const sy=Math.sin(yaw),cy=Math.cos(yaw);vel.x=THREE.MathUtils.damp(vel.x,(ix*cy+iz*sy)*3.4,9,dt);vel.z=THREE.MathUtils.damp(vel.z,(-ix*sy+iz*cy)*3.4,9,dt);if(jq&&jumps<2&&!finished){vel.y=grounded?6.2:5.4;grounded=false;jumps++;jq=false}vel.y-=14*dt;pos.addScaledVector(vel,dt);const gy=ground(pos.x,pos.z);if(gy!==null&&pos.y<=gy+.18&&vel.y<=0){pos.y=gy;vel.y=0;grounded=true;jumps=0;lastSafe.copy(pos)}else if(gy===null)grounded=false;if((!inBonus&&pos.y<-9)||(inBonus&&pos.y<BY-10)){pos.copy(lastSafe);pos.y+=.4;vel.set(0,0,0)}if(!inBonus)for(const c of chimes)if(Math.hypot(pos.x-c.x,pos.z-c.z)<.58)hit(c);if(portalOpen&&!inBonus&&cool<=0&&Math.hypot(pos.x-17.2,pos.z+5.2)<1.05)enterBonus();if(inBonus&&!finished&&Math.hypot(pos.x-reward.position.x,pos.z-reward.position.z)<.8)complete();const speed=Math.hypot(vel.x,vel.z);if(speed>.2){const w=Math.atan2(vel.x,vel.z);let d=w-heading;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;heading+=d*Math.min(1,dt*10)}h.g.position.copy(pos);h.g.rotation.y=heading;h.body.position.y=.68+(grounded&&speed>.5?Math.abs(Math.sin(t*9))*.045:0);h.cape.rotation.x=1+Math.sin(t*5)*.04;chimes.forEach((c,i)=>c.bell.rotation.z=Math.sin(t*2+i)*.08);portal.g.rotation.y=t*.7;back.g.rotation.y=-t*.8;reward.rotation.y=t*.8;reward.position.y=BY+2.1+Math.sin(t*1.3)*.22;rewardLight.position.set(0,reward.position.y+.2,0);stars.rotation.y=t*.008;glow.intensity=portalOpen?5:3;if(mt>0){mt-=dt;if(mt<=0)msg.classList.remove('show')}target.set(pos.x,pos.y+1.25,pos.z);const cp=Math.cos(pitch);cam.set(target.x+Math.sin(yaw)*cp*7.8,target.y+Math.sin(pitch)*7.8,target.z+Math.cos(yaw)*cp*7.8);camera.position.lerp(cam,1-Math.exp(-dt*9));camera.lookAt(target);renderer.render(scene,camera);frames++;const now=performance.now();if(mobile&&now-perfStart>4500){const fps=frames*1000/(now-perfStart);if(fps<42&&quality>.8){quality=Math.max(.8,quality-.15);applyQuality();say('画質を自動調整')}frames=0;perfStart=now}}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();applyQuality()});</script></body></html>
